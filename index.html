<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Việt - Tập Phát Âm Tiếng Trung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
        .pinyin { color: #3b82f6; }
        
        .listening {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <H1>Võ Lê Thế Vinh</H1>
    <div class="max-w-4xl mx-auto p-6">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-700 mb-2">🇨🇳 Trung Việt</h1>
            <p class="text-gray-600 text-lg">App tập phát âm tiếng Trung - Có đánh giá nói</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Input -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                    <i class="fas fa-keyboard text-indigo-600"></i>
                    Nhập tiếng Việt
                </h2>
                
                <textarea id="vietInput" class="w-full h-40 p-4 border border-gray-300 rounded-xl focus:outline-none focus:border-indigo-500 resize-none text-lg"
                    placeholder="Nhập câu tiếng Việt..."></textarea>

                <div class="flex gap-3 mt-4">
                    <button onclick="translateToChinese()" 
                            class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-4 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fas fa-language"></i>
                        Dịch & Phát Âm
                    </button>
                </div>
            </div>

            <!-- Result + Practice -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h2 class="text-xl font-semibold mb-4">Kết quả tiếng Trung</h2>

                <div id="chineseResult" class="text-4xl font-medium min-h-[70px] flex items-center border-b pb-4 mb-4"></div>
                
                <div class="mb-4">
                    <div class="text-xs uppercase text-gray-500 mb-1">Pinyin</div>
                    <div id="pinyinResult" class="pinyin text-2xl"></div>
                </div>

                <!-- Đánh giá phát âm -->
                <div class="bg-gray-50 rounded-xl p-5 mb-5 border border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-semibold text-lg">🎤 Đánh giá phát âm</h3>
                        <button onclick="startSpeechRecognition()" 
                                id="speakBtn"
                                class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-xl flex items-center gap-2 transition">
                            <i class="fas fa-microphone"></i>
                            <span>Nói theo</span>
                        </button>
                    </div>
                    
                    <div id="listeningStatus" class="hidden text-center py-6 text-red-500 font-medium">
                        <div class="listening text-2xl mb-2">🎙️ Đang nghe...</div>
                        <div class="text-sm text-gray-500">Hãy nói to và rõ câu tiếng Trung</div>
                    </div>

                    <div id="resultEvaluation" class="hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-medium">Độ chính xác:</span>
                            <span id="score" class="text-3xl font-bold text-emerald-600">85%</span>
                        </div>
                        <div class="h-3 bg-gray-200 rounded-full overflow-hidden">
                            <div id="scoreBar" class="h-full bg-emerald-500 rounded-full w-[85%]"></div>
                        </div>
                        <div id="recognizedText" class="mt-4 text-sm bg-white p-3 rounded-lg border"></div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="speakCurrent()" 
                            class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl flex items-center justify-center gap-2">
                        <i class="fas fa-volume-up"></i>
                        Nghe mẫu
                    </button>
                    <button onclick="copyResult()" 
                            class="flex-1 border border-gray-300 hover:bg-gray-50 py-3 rounded-xl flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i>
                        Sao chép
                    </button>
                </div>
            </div>
        </div>

        <!-- Sample Phrases -->
        <div class="mt-10">
            <h3 class="text-lg font-semibold mb-4 text-gray-700">Cụm từ gợi ý</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="samples"></div>
        </div>
    </div>

    <script>
        const dictionary = { /* giữ nguyên như cũ */ 
            "xin chào": { chinese: "你好", pinyin: "Nǐ hǎo", meaning: "Xin chào" },
            "cảm ơn": { chinese: "谢谢", pinyin: "Xièxiè", meaning: "Cảm ơn" },
            "bạn khỏe không": { chinese: "你好吗", pinyin: "Nǐ hǎo ma", meaning: "Bạn khỏe không?" },
            "rất vui được gặp bạn": { chinese: "很高兴认识你", pinyin: "Hěn gāoxìng rènshi nǐ", meaning: "Rất vui được gặp bạn" },
            "tạm biệt": { chinese: "再见", pinyin: "Zài jiàn", meaning: "Tạm biệt" },
            "bao nhiêu tiền": { chinese: "多少钱", pinyin: "Duōshǎo qián", meaning: "Bao nhiêu tiền?" },
            "tôi không hiểu": { chinese: "我不明白", pinyin: "Wǒ bù míngbái", meaning: "Tôi không hiểu" },
        };

        let currentChinese = "";
        let currentPinyin = "";

        function renderSamples() {
            const container = document.getElementById('samples');
            container.innerHTML = '';
            Object.keys(dictionary).forEach(key => {
                const item = dictionary[key];
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-xl border hover:border-indigo-300 cursor-pointer transition";
                div.innerHTML = `
                    <div class="text-sm text-gray-500">${key}</div>
                    <div class="text-2xl mt-1">${item.chinese}</div>
                    <div class="text-blue-600 text-sm">${item.pinyin}</div>
                `;
                div.onclick = () => {
                    document.getElementById('vietInput').value = key;
                    translateToChinese();
                };
                container.appendChild(div);
            });
        }

        async function translateToChinese() {
            const input = document.getElementById('vietInput').value.trim().toLowerCase();
            if (!input) return alert("Vui lòng nhập câu!");

            let found = false;
            for (let key in dictionary) {
                if (input.includes(key)) {
                    const data = dictionary[key];
                    document.getElementById('chineseResult').innerHTML = `<span class="text-4xl">${data.chinese}</span>`;
                    document.getElementById('pinyinResult').textContent = data.pinyin;
                    
                    currentChinese = data.chinese;
                    currentPinyin = data.pinyin;
                    found = true;
                    break;
                }
            }

            if (!found) {
                currentChinese = "你好";
                currentPinyin = "Nǐ hǎo";
                document.getElementById('chineseResult').innerHTML = `<span class="text-4xl">你好</span>`;
                document.getElementById('pinyinResult').textContent = "Nǐ hǎo";
            }

            // Reset đánh giá
            document.getElementById('resultEvaluation').classList.add('hidden');
            document.getElementById('listeningStatus').classList.add('hidden');
            
            speakCurrent();
        }

        function speakCurrent() {
            if (!currentChinese) return;
            const utterance = new SpeechSynthesisUtterance(currentChinese);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.95;
            speechSynthesis.speak(utterance);
        }

        // ==================== ĐÁNH GIÁ PHÁT ÂM ====================
        let recognition = null;

        function startSpeechRecognition() {
            if (!currentChinese) {
                alert("Vui lòng dịch một câu trước khi luyện nói!");
                return;
            }

            if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
                alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.lang = 'zh-CN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById('listeningStatus').classList.remove('hidden');
            document.getElementById('resultEvaluation').classList.add('hidden');
            document.getElementById('speakBtn').disabled = true;

            recognition.onresult = (event) => {
                const recognized = event.results[0][0].transcript;
                evaluatePronunciation(recognized);
            };

            recognition.onerror = () => {
                alert("Không nhận diện được giọng nói. Hãy thử lại.");
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };

            recognition.start();
        }

        function stopListening() {
            document.getElementById('listeningStatus').classList.add('hidden');
            document.getElementById('speakBtn').disabled = false;
        }

        function evaluatePronunciation(recognized) {
            stopListening();
            
            const target = currentChinese;
            const similarity = calculateSimilarity(recognized, target);
            const score = Math.round(similarity * 100);

            // Hiển thị kết quả
            document.getElementById('resultEvaluation').classList.remove('hidden');
            document.getElementById('score').textContent = score + "%";
            document.getElementById('scoreBar').style.width = score + "%";
            
            const color = score > 80 ? 'emerald' : score > 60 ? 'amber' : 'red';
            document.getElementById('score').className = `text-3xl font-bold text-${color}-600`;
            
            document.getElementById('recognizedText').innerHTML = `
                <strong>Bạn nói:</strong> <span class="text-gray-700">${recognized}</span><br>
                <strong>Mẫu:</strong> <span class="text-indigo-600">${target}</span>
            `;
        }

        // Tính độ tương đồng đơn giản
        function calculateSimilarity(str1, str2) {
            str1 = str1.toLowerCase().replace(/\s+/g, '');
            str2 = str2.toLowerCase().replace(/\s+/g, '');
            
            if (str1 === str2) return 1;
            
            const maxLen = Math.max(str1.length, str2.length);
            let matches = 0;
            
            for (let i = 0; i < Math.min(str1.length, str2.length); i++) {
                if (str1[i] === str2[i]) matches++;
            }
            
            return matches / maxLen;
        }

        function copyResult() {
            if (!currentChinese) return;
            navigator.clipboard.writeText(`\( {currentChinese}\n \){currentPinyin}`);
        }

        window.onload = () => {
            renderSamples();
            document.getElementById('vietInput').value = "rất vui được gặp bạn";
            translateToChinese();
        };
    </script>
</body>
</html>
