<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Học Phát Âm Trung - Việt</title>
    <style>
        :root {
            --primary: #de2910;
            --dark: #2c3e50;
            --success: #27ae60;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            padding: 25px;
            box-sizing: border-box;
            border-top: 6px solid var(--primary);
        }

        h2 {
            text-align: center;
            color: var(--dark);
            margin-top: 0;
            font-size: 22px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-translate {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-translate:hover {
            opacity: 0.9;
        }

        .result-card {
            background-color: var(--light);
            border: 2px solid #eef0f2;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .zh-text {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            margin: 0 0 10px 0;
        }

        .action-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-action {
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-speak {
            background-color: var(--dark);
            color: white;
        }

        .btn-record {
            background-color: #3498db;
            color: white;
        }

        .btn-record.recording {
            background-color: var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .score-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            text-align: left;
            display: none;
            border-left: 5px solid;
        }

        .score-success {
            background-color: #e8f8f0;
            border-left-color: var(--success);
            color: #1e7e34;
        }

        .score-fail {
            background-color: #fdf3f2;
            border-left-color: #e74c3c;
            color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập Tiếng Việt ➔ Phát Âm Tiếng Trung</h2>
    
    <!-- Ô nhập liệu tiếng Việt -->
    <div class="input-group">
        <label for="vi-input">Nhập từ hoặc câu bằng Tiếng Việt:</label>
        <input type="text" id="vi-input" placeholder="Ví dụ: Bạn khỏe không?, Tạm biệt..." value="Tôi muốn học tiếng Trung">
    </div>

    <button class="btn-translate" onclick="translateText()">Chuyển sang tiếng Trung</button>

    <!-- Thẻ kết quả hiển thị từ tiếng Trung -->
    <div class="result-card" id="result-card">
        <label>Chữ Hán dịch được:</label>
        <div class="zh-text" id="zh-output">...</div>
        
        <!-- Các nút tương tác phát âm -->
        <div class="action-group">
            <button class="btn-action btn-speak" onclick="speakChinese()">🔊 Nghe mẫu</button>
            <button class="btn-action btn-record" id="record-btn" onclick="startSpeechRecognition()">🎙️ Đọc thử</button>
        </div>

        <!-- Khối chấm điểm -->
        <div class="score-box" id="score-box"></div>
    </div>
</div>

<script>
    let currentChineseWord = "";

    // 1. Tính năng dịch từ Tiếng Việt sang Tiếng Trung (Dùng API miễn phí)
    async function translateText() {
        const viText = document.getElementById('vi-input').value.trim();
        if (!viText) return alert("Vui lòng nhập nội dung tiếng Việt!");

        const zhOutput = document.getElementById('zh-output');
        const resultCard = document.getElementById('result-card');
        const scoreBox = document.getElementById('score-box');
        
        zhOutput.innerText = "Đang dịch...";
        resultCard.style.display = "block";
        scoreBox.style.display = "none";

        try {
            // ĐÃ SỬA: Thay đổi URL chính xác của API MyMemory
            const response = await fetch(`https://translated.net{encodeURIComponent(viText)}&langpair=vi|zh-CN`);
            const data = await response.json();
            
            if (data.responseData && data.responseData.translatedText) {
                currentChineseWord = data.responseData.translatedText;
                zhOutput.innerText = currentChineseWord;
            } else {
                zhOutput.innerText = "Lỗi dịch thuật!";
            }
        } catch (error) {
            zhOutput.innerText = "Lỗi kết nối mạng!";
            console.error(error);
        }
    }

    // 2. Tính năng phát âm mẫu Tiếng Trung (Text-to-Speech)
    function speakChinese() {
        if (!currentChineseWord) return;
        const utterance = new SpeechSynthesisUtterance(currentChineseWord);
        utterance.lang = 'zh-CN'; // Ngôn ngữ: Tiếng Trung phổ thông
        utterance.rate = 0.8;    // Tốc độ 0.8 giúp người học dễ nghe rõ âm điệu
        window.speechSynthesis.speak(utterance);
    }

    // 3. Tính năng thu âm và đối chiếu kết quả phát âm (Speech Recognition)
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; // Nhận diện tiếng Trung
        recognition.interimResults = false;

        recognition.onstart = function() {
            const btn = document.getElementById('record-btn');
            btn.innerText = "🛑 Đang nghe...";
            btn.classList.add('recording');
        };

        // ĐÃ SỬA: Đóng đầy đủ các khối lệnh và sửa logic lấy dữ liệu text
        recognition.onresult = function(event) {
            const userSpeech = event.results[0][0].transcript;
            const scoreBox = document.getElementById('score-box');
            scoreBox.style.display = "block";

            // Chuẩn hóa chuỗi bằng cách xóa bỏ các dấu câu cơ bản để so sánh chính xác hơn
            const cleanUser = userSpeech.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"").trim();
            const cleanTarget = currentChineseWord.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"").trim();

            if (cleanUser === cleanTarget) {
                scoreBox.className = "score-box score-success";
                scoreBox.innerHTML = `<b>Kết quả:</b> Bạn nói <span style="text-decoration:underline">"${userSpeech}"</span>.<br>🎉 <b>Chính xác!</b> Bạn phát âm rất chuẩn.`;
            } else {
                scoreBox.className = "score-box score-fail";
                scoreBox.innerHTML = `<b>Kết quả:</b> Máy nghe ra <span style="text-decoration:underline">"${userSpeech}"</span>.<br>❌ <b>Chưa chuẩn!</b> Hãy bấm nghe mẫu và thử lại nhé.`;
            }
        };

        recognition.onerror = function(event) {
            alert('Lỗi thu âm: ' + event.error + '. Hãy chắc chắn bạn đã cho phép quyền sử dụng Micro.');
        };

        recognition.onend = function() {
            const btn = document.getElementById('record-btn');
            btn.innerText = "🎙️ Đọc thử";
            btn.classList.remove('recording');
        };
    } else {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy mở bằng Google Chrome!");
    }

    function startSpeechRecognition() {
        if (recognition && currentChineseWord) {
            recognition.start();
        }
    }
</script>

</body>
</html>
